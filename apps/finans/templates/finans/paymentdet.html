{% extends 'users/base.html' %}

{% block title %}Детали платежа{% endblock %}

{% block content %}
    <h1>Информация о выбранной вами платежке</h1>
    <div class="pay-info">
        <p>Дата выполнения: {{ payment.date_done }}</p>
        <p>Сумма: {{ payment.amount }}</p>
        <p>Валюта: {{ payment.currency }}</p>
        <span class="color-dot" style="background-color: {{ payment.category.color }};"></span><span>{{ payment.category.name }}</span>

{% endblock %}
